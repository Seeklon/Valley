[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ignis-valley"
version = "0.1.0"
description = "Traceable 3D fire transport and combustion research workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "numpy==2.2.5",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "pyarrow==20.0.0",
  "joblib==1.5.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "ruff==0.11.9"]

[project.scripts]
ignis = "ignis.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
