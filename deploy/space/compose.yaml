name: momentum-space
services:
  site:
    image: nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    container_name: momentum-space
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/momentum-space:/srv/site:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
networks:
  edge:
    external: true
    name: momentum-personal-edge
